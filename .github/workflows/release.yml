# Builds the AppImage and the Windows zip for a release tag, v<version>, and attaches them
# to a draft GitHub Release, to be reviewed and published by hand. Started by hand on any
# branch, it builds the same files (named after their commit) and keeps them only as the
# run's artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.10"
  # What Qt for Python needs from the system to load, beyond what every runner has: the
  # tests, the icon drawn by both builds and the libraries the AppImage bundles.
  QT_PACKAGES: >-
    libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libgtk-3-0 libwayland-client0
    libwayland-cursor0 libwayland-egl1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0
    libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1
    libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends $QT_PACKAGES
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src/
      - run: uv run pytest

  linux:
    name: AppImage
    needs: checks
    # The AppImage runs where glibc is at least the build machine's: 2.35 here.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Qt's system libraries and FUSE
        # FUSE mounts the AppImage when its process tests start it.
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends $QT_PACKAGES fuse3
      - run: uv sync --locked
      - run: uv run appimage/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows zip
    needs: checks
    runs-on: ubuntu-24.04
    env:
      WINE_VERSION: "11.0.0.0~noble-1" # WineHQ's stable, the Wine the build is tried with
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install Wine and Qt's system libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -p /etc/apt/keyrings
          sudo curl --fail --silent --show-error --location \
            --output /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo curl --fail --silent --show-error --location \
            --output /etc/apt/sources.list.d/winehq-noble.sources \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install --yes --install-recommends "winehq-stable=$WINE_VERSION"
          sudo apt-get install --yes --no-install-recommends $QT_PACKAGES
      - run: uv sync --locked
      - run: uv run windows/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attach the files to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=$([[ "$TAG" =~ (a|b|rc)[0-9]+$ ]] && echo --prerelease || true)
            gh release create "$TAG" dist/* --draft --verify-tag $prerelease \
              --title "Virtual Pet ${TAG#v}" --generate-notes
          fi
