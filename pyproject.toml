[project]
name = "virtual-pet"
version = "0.3.0"
description = "A little pixel-art pet that lives on your desktop."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Gabriel Quilice", email = "gabrielnquilice@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.11.2",
]

[project.gui-scripts]
virtual-pet = "virtual_pet.app:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "hypothesis>=6.168.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings are written where they help, not enforced everywhere
    "CPY001",  # the copyright notice is in the README, not in every file
    "COM812",  # conflicts with the formatter
    "ISC001",  # conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is how pytest works
    "PLR2004", # magic values are fine in tests
    "ANN",     # annotations are optional in tests
    "S311",    # seeded pseudo-random generators make tests deterministic
    "S603",    # tests start the app they test, from source or a built one
]
"{appimage,windows}/*.py" = [
    "INP001",  # folders of build scripts, not packages
    "S603",    # running the build tools is what the build script is for
    "S606",    # it starts itself again under uv, in the build environment
    "S607",    # those tools are found on PATH
    "T201",    # a command-line script reports its progress by printing
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=virtual_pet",
    "--cov-report=term-missing",
]
filterwarnings = ["error"]
markers = [
    "process: starts the real app in a subprocess (VIRTUAL_PET_EXECUTABLE picks a built one)",
]

[tool.coverage.run]
branch = true
source = ["virtual_pet"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true
